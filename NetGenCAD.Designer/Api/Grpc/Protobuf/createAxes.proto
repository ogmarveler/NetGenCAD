syntax = "proto3";

package createAxes;

option csharp_namespace = "NetGenCAD.Designer.Api.Grpc.Protobuf";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Enums from NetGenCAD.Core.Measurements.Selector and related
enum UnitSystem {
  UNIT_SYSTEM_UNSPECIFIED = 0;
  METRIC = 1;      // Metric (mm)
  IMPERIAL = 2;    // Imperial (in)
}

enum BackgroundType {
  BACKGROUND_TYPE_UNSPECIFIED = 0;
  LIGHT = 1;       // Light Theme
  DARK = 2;        // Dark Theme
}

// Simplified OpenScadColor - common ones used; full list is large, extend as needed
enum OpenScadColor {
  OPEN_SCAD_COLOR_UNSPECIFIED = 0;
  BLACK = 1;
  WHITE = 2;
  // Add more as needed from Colors.OpenScadColor
}

// Model: GeneratedModule from NetGenCAD.Axis.Scad.Models.GeneratedModule
message GeneratedModule {
  string calling_method = 1;
  string unit = 2;          // e.g. "Metric"
  string theme = 3;         // e.g. "Light"
  double range_x = 4;
  double range_y = 5;
  double range_z = 6;
  double min_x = 7;
  double max_x = 8;
  double min_y = 9;
  double max_y = 10;
  double min_z = 11;
  double max_z = 12;
  string volume = 13;
  int32 axis_id = 14;
  optional string color_hex = 15; // Stored hex color, when present
  optional string oscad_color = 16; // Stored named color, when present
  optional double axis_color_alpha = 17; // Stored effective opacity
}

// Model: AxisConversionResult from CreateAxesFunctions
message AxisConversionResult {
  double min_x = 1;
  double max_x = 2;
  double min_y = 3;
  double max_y = 4;
  double min_z = 5;
  double max_z = 6;
  double volume = 7;
  double volume_scale = 8;
}

message ConvertUnitsRequest {
  double min_x = 1;
  double max_x = 2;
  double min_y = 3;
  double max_y = 4;
  double min_z = 5;
  double max_z = 6;
  double volume = 7;
  double volume_scale = 8;
  int32 decimal_places = 9;
  UnitSystem from_unit = 10;
  UnitSystem to_unit = 11;
}

// Model: AxisSettings from AxisConfig.AxisSettings
message AxisSettings {
  string output_directory = 1;
  BackgroundType background_type = 2;
  UnitSystem unit_system = 3;
  double min_x = 4;
  double max_x = 5;
  double min_y = 6;
  double max_y = 7;
  double min_z = 8;
  double max_z = 9;
  OpenScadColor open_scad_color = 10;
  double axis_color_alpha = 11;
  // Computed increments (for reference; can be recalculated)
  double increment_x = 12;
  double increment_y = 13;
  double increment_z = 14;
  double increment_x2 = 15;
  double increment_y2 = 16;
  double increment_z2 = 17;
  double increment_x3 = 18;
  double increment_y3 = 19;
  double increment_z3 = 20;
  double increment_x4 = 21;
  double increment_y4 = 22;
  double increment_z4 = 23;
  string unit = 24;  // "mm" or "in"
}

// Model: CustomAxis from AxisConfig.CustomAxis
message CustomAxis {
  AxisSettings settings = 1;
  string calling_method = 2;
  string module_name = 3;
  double total_cubic_volume = 4;
  int32 axis_id = 5;          // unique identifier for this axis configuration
  string total_cubic_volume_unit = 6;
  double total_cubic_volume_scale = 7;
  string total_cubic_volume_scale_unit = 8;
  optional string color_hex = 9; // Set when the resulting color is hex
  optional string oscad_color = 10; // Set when the resulting color is a named OpenSCAD color
  double axis_color_alpha = 11; // Effective opacity after validation and rounding
}

message CreateCustomAxisRequest {
  double min_x = 1;
  double max_x = 2;
  double min_y = 3;
  double max_y = 4;
  double min_z = 5;
  double max_z = 6;
  UnitSystem selected_unit = 7;
  BackgroundType selected_background = 8;
  optional int32 decimal_places = 9;
  optional string color_hex = 10; // #RGB or #RRGGBB; takes precedence over oscad_color
  optional string oscad_color = 11; // Named OpenSCAD color; defaults to the background's axis color
  optional double axis_color_alpha = 12; // 0 to 1; defaults to 1, with 0 adjusted to 0.01 for visibility
}

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

service AxesService {
  // Retrieves and filters axes from axes.scad
  rpc GetAxesList (google.protobuf.Empty) returns (GetAxesListResponse) {
    option (google.api.http) = {
      get: "/v1/axes"
    };
  }

  // Unit conversions
  rpc ConvertToImperial (ConvertUnitsRequest) returns (AxisConversionResult) {
    option (google.api.http) = {
      post: "/v1/axes/convert/imperial"
      body: "*"
    };
  }

  rpc ConvertToMetric (ConvertUnitsRequest) returns (AxisConversionResult) {
    option (google.api.http) = {
      post: "/v1/axes/convert/metric"
      body: "*"
    };
  }

  // Axis creation
  rpc CreateUpdateAxis (CreateCustomAxisRequest) returns (CustomAxis) {
    option (google.api.http) = {
      post: "/v1/axes/createUpdate"
      body: "*"
    };
  }

    // Delete a solid or module within an object
  rpc DeleteAxis (DeleteAxisRequest) returns (StringResponse) {
    option (google.api.http) = {
      delete: "/v1/axes/deleteAxis"
      body: "*"
    };
  }
}

// AxisDimensions from NetGenCAD.Designer.Repositories.AxisDimensions
message AxisDimensions {
  int32 id = 1;
  string theme = 2;
  string unit = 3;
  double min_x = 4;
  double max_x = 5;
  double min_y = 6;
  double max_y = 7;
  double min_z = 8;
  double max_z = 9;
  string oscad_method = 10;
  string include_method = 11;
  int64 created_at_unix = 12;
}

message GetAxesListResponse {
 // repeated GeneratedModule all_axes = 1;
  repeated GeneratedModule metric_axes = 2;
  repeated GeneratedModule imperial_axes = 3;
}

message StringList {
  repeated string values = 1;
}

message DeleteAxisRequest {
  optional string axis_calling_method = 1;
  optional int32 axis_id = 2;
}

message StringResponse {
  string message = 1;
}