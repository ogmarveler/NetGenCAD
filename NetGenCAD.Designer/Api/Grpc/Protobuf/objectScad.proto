syntax = "proto3";

package objectScad;

option csharp_namespace = "NetGenCAD.Designer.Api.Grpc.Protobuf";

import "Api/Grpc/Protobuf/createAxes.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// Enums
enum OperationType {
  OPERATION_TYPE_UNSPECIFIED = 0;
  UNION = 1;
  DIFFERENCE = 2;
  INTERSECTION = 3;
}

enum SolidType {
  SOLID_TYPE_UNSPECIFIED = 0;
  CUBE = 1;
  ROUND_CUBE = 2;
  CYLINDER = 3;
  ROUND_CYLINDER = 4;
  SPHERE = 5;
  POLYHEDRON = 6;
  SURFACE = 7;
  TEXT = 8;
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  SOLID = 1;
  MODULE = 2;
}

// SolidDimensions from NetGenCAD.Designer.Repositories.SolidDimensions
// ObjectScadFunctions should handle the optional params based on what type of solid is selected.
// The service will validate the params for each solid type and return an error if any are missing.
// Use for CRUD ops, match UI with unit measurement supplied in a GET request to return Imperial or Metric values. 
// The service will convert to the selected unit system and return the converted values in the response.
message SolidDimensions {
  optional int32 id = 1;
  optional int32 axis_dimensions_id = 2; // Lookup Logic handled in the service request
  optional int32 object_module_id = 3;
  optional string object_module_name = 4;
  optional string solid_call_method = 5;
  optional string shape_name = 6;
  optional string material = 7;  // Selected Filament
  optional OperationType operation_type = 8;
  optional SolidType solid_type = 9;
  optional string description = 10;

  // Cube / RoundCube
  optional double length = 11;
  optional double width = 12;
  optional double height = 13;
  optional double thickness = 14;

  // Cylinder
  optional double radius = 15;
  optional double radius1 = 16;
  optional double radius2 = 17;
  optional double cylinder_height = 18;

  // Transforms
  optional double x_offset = 19;
  optional double y_offset = 20;
  optional double z_offset = 21;
  optional double x_rotate = 22;
  optional double y_rotate = 23;
  optional double z_rotate = 24;

  // Rounding, if the user wants more flexibility than what is available in the UI
  optional double round_r = 25;
  optional double round_h = 26;
  optional int32 resolution = 27;

  // Surface
  optional string surface_file_path = 28;
  optional bool surface_file_format = 29; // e.g. "png", "bmp", "dat", etc.
  optional bool surface_center = 30;
  optional bool surface_invert = 31;
  optional int32 surface_convexity = 32;
  optional double surface_scale_x = 33;
  optional double surface_scale_y = 34;
  optional double surface_scale_z = 35;

  // Text
  optional string text_input = 36;
  optional double text_size = 37;
  optional double text_depth = 38;
  // Text options accept Selector enum names or UI descriptions, case-insensitively.
  // Defaults: Sans, Left, Baseline, L-to-R, and EN, respectively.
  optional string font_input = 39;
  optional string text_align = 40;
  optional string vertical_align = 41;
  optional string text_direction = 42;
  optional string language_input = 43;

  // Units
  optional double volume_cm3 = 44;
  optional double volume_in3 = 45;

  // OSCAD
  optional string oscad_method = 46;

  // Timestamp
  optional string created_at = 47;
}

// ModuleDimensions from NetGenCAD.Designer.Repositories.ModuleDimensions
message ModuleDimensions {
  int32 id = 1;
  string name = 2;
  string module_type = 3;     // "Union", "Difference", etc.
  string solid_type = 4;
  string object_name = 5;
  string object_description = 6;
  double x_offset_mm = 7;
  double y_offset_mm = 8;
  double z_offset_mm = 9;
  double x_offset_in = 10;
  double y_offset_in = 11;
  double z_offset_in = 12;
  double x_rotate = 13;
  double y_rotate = 14;
  double z_rotate = 15;
  string include_method = 16;
  string oscad_method = 17;
  int64 created_at_unix = 18;  // DateTime as unix timestamp
  int32 layer = 19;
  string module_color = 20;
}

// AxisDimensions from NetGenCAD.Designer.Repositories.AxisDimensions
message AxisDimensions {
  int32 id = 1;
  string theme = 2;
  string unit = 3;
  double min_x = 4;
  double max_x = 5;
  double min_y = 6;
  double max_y = 7;
  double min_z = 8;
  double max_z = 9;
  string oscad_method = 10;
  string include_method = 11;
  int64 created_at_unix = 12;
}

// Request helpers for ObjectScadFunctions
message CreateAxisRequest {
  createAxes.GeneratedModule selected_axis = 1;
  createAxes.UnitSystem selected_axis_unit = 2;
  double axis_x_position_mm = 3;
  double axis_y_position_mm = 4;
  double axis_z_position_mm = 5;
  int32 decimal_places = 6;
  string object_file_path = 7;
}

message UpdateSolidRequest {
  SolidDimensions solid = 1;
}

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

service ObjectScadService {

  // Object creation & management
  rpc CreateUpdateSolid (CreateSolidRequest) returns (CreateSolidResponse) {
    option (google.api.http) = {
      post: "/v1/objects/createUpdate"
      body: "*"
    };
  }

  // Delete a solid or module within an object
  rpc DeleteItem (DeleteItemRequest) returns (createAxes.StringResponse) {
    option (google.api.http) = {
      delete: "/v1/objects/deleteItem"
      body: "*"
    };
  }

  rpc CopyObject (CopyObjectRequest) returns (CopyObjectResponse) {
    option (google.api.http) = {
      post: "/v1/objects/copy"
      body: "*"
    };
  }

  // SCAD generation
  rpc GenerateOSCAD (GenerateOSCADRequest) returns (GenerateOSCADResponse) {
    option (google.api.http) = {
      post: "/v1/objects/generate-os-cad"
      body: "*"
    };
  }

  rpc PartsToScadFiles (PartsToScadFilesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/objects/parts-to-scad"
      body: "*"
    };
  }

  rpc ObjectToScadFiles (ObjectToScadFilesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/objects/to-scad"
      body: "*"
    };
  }

  // Boolean modules
  rpc CreateUnionModule (CreateBooleanModuleRequest) returns (ModuleDimensions) {
    option (google.api.http) = {
      post: "/v1/objects/boolean/union"
      body: "*"
    };
  }

  rpc CreateDifferenceModule (CreateBooleanModuleRequest) returns (ModuleDimensions) {
    option (google.api.http) = {
      post: "/v1/objects/boolean/difference"
      body: "*"
    };
  }

  rpc CreateIntersectionModule (CreateBooleanModuleRequest) returns (ModuleDimensions) {
    option (google.api.http) = {
      post: "/v1/objects/boolean/intersection"
      body: "*"
    };
  }

  // Queries & helpers
  rpc GetDimensionsParts (GetDimensionsPartsRequest) returns (GetDimensionsPartsResponse) {
    option (google.api.http) = {
      post: "/v1/objects/dimensions"
      body: "*"
    };
  }

  rpc GetFilteredAxesList (GetFilteredAxesListRequest) returns (GetFilteredAxesListResponse) {
    option (google.api.http) = {
      post: "/v1/objects/axes/filtered"
      body: "*"
    };
  }

  rpc ConvertInputsToImperial (ConvertSolidInputsRequest) returns (ConvertSolidInputsResponse) {
    option (google.api.http) = {
      post: "/v1/objects/convert/imperial"
      body: "*"
    };
  }

  rpc ConvertInputsToMetric (ConvertSolidInputsRequest) returns (ConvertSolidInputsResponse) {
    option (google.api.http) = {
      post: "/v1/objects/convert/metric"
      body: "*"
    };
  }

  rpc ExportToStl (ExportToStlRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/objects/export/stl"
      body: "*"
    };
  }
}

message CreateAxisResponse {
  int32 axis_id = 1;
  AxisDimensions axis_dimensions = 2;
  double axis_x_position_mm = 3;
  double axis_y_position_mm = 4;
  double axis_z_position_mm = 5;
  string object_axis_display = 6;
  string object_axis_unit_display = 7;
  createAxes.UnitSystem selected_unit_value = 8;
}

message UpdateAxisTranslateRequest {
  bool axis_stored = 1;
  AxisDimensions axis_dimensions = 2;
  createAxes.GeneratedModule selected_axis = 3;
  double axis_x_position_mm = 4;
  double axis_y_position_mm = 5;
  double axis_z_position_mm = 6;
  createAxes.UnitSystem selected_axis_unit = 7;
  int32 decimal_places = 8;
  bool remove_axis = 9;
  string object_file_path = 10;
}

message UpdateAxisTranslateResponse {
  bool success = 1;
  string message = 2;
}

message CreateSolidRequest {
  SolidType selected_solid_type = 1;
  string object_name = 2;
  string description = 3;
  optional int32 axis_id = 4; // Required only if axis calling method not present
  // optional string selected_filament = 5;
  OperationType selected_operation_type = 6;
  SolidDimensions dimensions = 7;  // carries most numeric params, Imperial or Metric is converted based on selected_unit
  int32 layer = 8;
  optional double alpha = 9; // default is 1
  createAxes.UnitSystem selected_unit = 10;
  optional int32 decimal_places = 11; // default is 2 places
  optional string axis_used_calling_method = 12; // Can be looked up in the list of axes on Create Axes tab (click clipboard)
  optional bool append_object = 13; // Used for NetGenCAD Set; default is false
  optional bool is_pre_rendered = 14; // For adding this into the SCAd code itself; default is true
  optional string color_hex = 15; // if supplied in the request, then use instead of oscad_color
  optional string oscad_color = 16; // OpenSCAD available colors; check UI for colors
}

message CreateSolidResponse {
  int32 object_id = 1;
  string object_name = 2;
  string oscad_file = 3;
  createAxes.UnitSystem selected_unit = 4;
  int32 axis_id = 5;
  string axis_used_calling_method = 6;
  string axis_display_name = 7;
  ModuleObject object_module = 8;
}

message ModuleObject {
  int32 object_module_id = 1;
  string object_module_name = 2;
  SolidDimensions created_solid = 3;
}

message CopyObjectRequest {
  string source_object_name = 1;
}

message CopyObjectResponse {
  repeated SolidDimensions solids = 1;
  repeated ModuleDimensions modules = 2;
}

message DeleteItemRequest {
  ItemType item_type = 1;  // "Solid" or "Module"
  int32 item_id = 2;
}

message GenerateOSCADRequest {
  SolidDimensions solid = 1;
  bool is_cube_selected = 2;
  bool is_round_cube_selected = 3;
  bool is_surface_selected = 4;
  bool is_cylinder_selected = 5;
  bool is_sphere_selected = 6;
  bool is_text_selected = 7;
  createAxes.UnitSystem selected_unit = 8;
  int32 decimal_places = 9;
  // surface / text params
  double surface_scale_x = 10;
  double surface_scale_y = 11;
  double surface_scale_z = 12;
  string surface_file_path = 13;
  string text_input = 14;
  double text_size = 15;
  string font_input = 16;
}

message GenerateOSCADResponse {
  string oscad_method = 1;
}

message PartsToScadFilesRequest {
  string object_name = 1;
  string object_description = 2;
  string object_file_path = 3;
  repeated SolidDimensions solid_dimensions = 4;
  repeated ModuleDimensions module_dimensions = 5;
}

message ObjectToScadFilesRequest {
  string object_file_path = 1;
  repeated ModuleDimensions module_dimensions = 2;
  double x_mirror = 3;
  double y_mirror = 4;
  double z_mirror = 5;
}

message CreateBooleanModuleRequest {
  string object_name = 1;
  string object_description = 2;
  repeated SolidDimensions solid_dimensions = 3;
  repeated ModuleDimensions module_dimensions = 4;
  bool is_pre_rendered = 5;
}

message GetDimensionsPartsRequest {
  string object_name = 1;
}

message GetDimensionsPartsResponse {
  repeated SolidDimensions solids = 1;
  repeated ModuleDimensions modules = 2;
}

message GetFilteredAxesListRequest {
  createAxes.UnitSystem selected_axis_unit = 1;
  repeated createAxes.GeneratedModule axes_modules_list = 2;
  bool axis_stored = 3;
  string selected_axis_value = 4;
}

message GetFilteredAxesListResponse {
  repeated string filtered_axes = 1;
  string selected_axis_value = 2;
  createAxes.GeneratedModule selected_axis = 3;
}

message ConvertSolidInputsRequest {
  double length = 1;
  double width = 2;
  double height = 3;
  double thickness = 4;
  double radius = 5;
  double radius1 = 6;
  double radius2 = 7;
  double cylinder_height = 8;
  double x_offset = 9;
  double y_offset = 10;
  double z_offset = 11;
  int32 decimal_places = 12;
}

message ConvertSolidInputsResponse {
  double length = 1;
  double width = 2;
  double height = 3;
  double thickness = 4;
  double radius = 5;
  double radius1 = 6;
  double radius2 = 7;
  double cylinder_height = 8;
  double x_offset = 9;
  double y_offset = 10;
  double z_offset = 11;
}

message ExportToStlRequest {
  string object_file_path = 1;
  bool should_restore_axis = 2;
}

message ObjectProgress {
  string stage = 1;
  int32 percent_complete = 2;
  string message = 3;
  SolidDimensions partial_result = 4;
  bool is_complete = 5;
  string error = 6;
}

message DimensionsPart {
  oneof part {
    SolidDimensions solid = 1;
    ModuleDimensions module = 2;
  }
}

message ExportProgress {
  string stage = 1;          // e.g. "Rendering", "Writing STL"
  int32 percent_complete = 2;
  string message = 3;
  string output_path = 4;
  bool is_complete = 5;
  string error = 6;
}